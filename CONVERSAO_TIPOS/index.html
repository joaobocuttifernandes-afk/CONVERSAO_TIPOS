<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversão entre tipos string para numéricos</title>
<script type = "text/javascript">
    var num1 = parseInt(prompt("Digite o primeiro valor: "));
    var num2 = parseInt(prompt("Digite o segundo valor: "));

    document.write("A soma entre os números é: ",num1+num2 ,"<br>");
    document.write("A multiplicação entre os números é: ",num1*num2 ,"<br>");
    document.write("A subtração entre os números é: ",num1-num2 ,"<br>");
    document.write("A divisão entre os números é: ",num1/num2 ,"<br>");

</script>


</head>
<body>
    
</body>
</html>
